
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>KHK Android HTTPS Bridge Test</title>
</head>
<body>

  <h2>KHK ProcessingPlantAI</h2>
  <p>HTTPS to Android Localhost Bridge Test</p>

  <button onclick="readWeight()">
    Read Weight
  </button>

  
  <button onclick="saveTestTransaction()">
    Save Test Transaction
  </button>
  
  <button onclick="viewTransactions()">
    View Saved Transactions
  </button>
  
  <pre id="db-result">No transactions saved yet.</pre>

  
  <pre id="result">Waiting for test...</pre>

  <script>
    async function readWeight() {
      const result = document.getElementById("result");
      result.textContent = "Connecting...";

      try {
        const response = await fetch(
          "http://127.0.0.1:8765/weight",
          {
            method: "GET",
            mode: "cors",
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        result.textContent =
          "CONNECTED: " + data.connected + "\n" +
          "STABLE: " + data.stable + "\n" +
          "WEIGHT: " + data.weight_g + " g\n" +
          "DEVICE: " + data.device;

      } catch (error) {
        result.textContent =
          "BRIDGE ERROR: " + error.message;
      }
    }
  </script>


  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          const registration =
            await navigator.serviceWorker.register("./sw.js");
  
          console.log(
            "KHK Service Worker registered:",
            registration.scope
          );
  
        } catch (error) {
          console.error(
            "Service Worker registration failed:",
            error
          );
        }
      });
    }
  </script>



  
<script src="./db.js"></script>

<script>
  async function saveTestTransaction() {
    const output = document.getElementById("db-result");

    try {
      const response = await fetch(
        "http://127.0.0.1:8765/weight",
        { cache: "no-store" }
      );

      if (!response.ok) {
        throw new Error("Weight bridge unavailable");
      }

      const weight = await response.json();

      if (!weight.connected || !weight.stable) {
        throw new Error("Scale reading not ready");
      }

      if (!Number.isFinite(weight.weight_g) ||
          weight.weight_g <= 0) {
        throw new Error("Invalid weight");
      }

      const transaction = {
        transaction_id: crypto.randomUUID(),
        source_qr: "SOURCE-TEST-001",
        packaging_qr: "PACK-TEST-001",
        weight_g: weight.weight_g,
        device: weight.device,
        created_at: new Date().toISOString(),
        sync_status: "PENDING",
        simulated: true
      };

      await saveWeighingTransaction(transaction);

      output.textContent =
        "TRANSACTION SAVED LOCALLY\n" +
        "ID: " + transaction.transaction_id + "\n" +
        "SOURCE: " + transaction.source_qr + "\n" +
        "PACKAGING: " + transaction.packaging_qr + "\n" +
        "WEIGHT: " + transaction.weight_g + " g\n" +
        "SYNC: " + transaction.sync_status;

    } catch (error) {
      output.textContent =
        "SAVE ERROR: " + error.message;
    }
  }

  async function viewTransactions() {
    const output = document.getElementById("db-result");

    try {
      const transactions =
        await getWeighingTransactions();

      output.textContent =
        "SAVED TRANSACTIONS: " +
        transactions.length + "\n\n" +
        JSON.stringify(transactions, null, 2);

    } catch (error) {
      output.textContent =
        "DATABASE ERROR: " + error.message;
    }
  }
</script>

  
  
</body>
</html>
